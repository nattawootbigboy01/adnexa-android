name = "contentnex-api"
main = "src/index.mjs"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "ADMIN_DB"
database_name = "contentnex-db"
database_id = "b820a19b-dd98-4a9f-9aa0-996789ce1a4c"
migrations_dir = "migrations"

[vars]
FIREBASE_PROJECT_ID = "adnexa-8daea"
ADMIN_FIREBASE_PROJECT_ID = "contentnex-admin"

# Preview settings do not inherit production bindings.
# This binding uses an isolated staging database, never the production database.
[previews]

[[previews.d1_databases]]
binding = "ADMIN_DB"
database_name = "contentnex-prev"
database_id = "4797d5b4-c8ee-44a6-af06-603cffb8640d"

# Set APP_ORIGIN only when the final web origin is known.
# Native Android requests do not rely on browser CORS.
# Do not add API keys or other secrets to this file.
