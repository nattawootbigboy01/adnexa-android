name: Build ADNEXA APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "feature/firebase-email-auth" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project files
        run: flutter create . --platforms=android --project-name adnexa
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Build release APK
        run: >-
          flutter build apk --release
          --dart-define=FIREBASE_API_KEY=${{ vars.FIREBASE_API_KEY }}
          --dart-define=FIREBASE_APP_ID=${{ vars.FIREBASE_APP_ID }}
          --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          --dart-define=FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID }}
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: adnexa-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
