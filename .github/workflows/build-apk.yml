name: Build ADNEXA APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project files
        run: flutter create . --platforms=android --project-name adnexa
      - name: Apply ADNEXA launcher icon and app name
        run: |
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_adnexa.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#090A10" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#A88BFF" android:pathData="M18,43 L58,29 L58,73 L18,59 Z"/>
              <path android:fillColor="#E8E8F2" android:pathData="M58,36 L78,22 L78,80 L58,66 Z"/>
              <path android:fillColor="#B99BFF" android:pathData="M28,62 L38,86 L51,86 L42,57 Z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M65,18 L72,18 L72,11 L91,11 L91,30 L84,30 L84,23 L73,34 L68,29 L79,18 Z"/>
              <path android:fillColor="#9270FF" android:pathData="M66,48 L74,40 L82,48 L89,41 L94,46 L82,59 L74,51 L66,59 Z"/>
          </vector>
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = s.replace('android:label="adnexa"', 'android:label="ADNEXA ยิงแอด"')
          s = s.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@drawable/ic_adnexa"')
          p.write_text(s)
          PY
      - name: Install dependencies
        run: flutter pub get
      # Deprecation notices are informational; fail only on analyzer errors.
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Build release APK
        run: >-
          flutter build apk --release
          --dart-define=FIREBASE_API_KEY=${{ vars.FIREBASE_API_KEY }}
          --dart-define=FIREBASE_APP_ID=${{ vars.FIREBASE_APP_ID }}
          --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          --dart-define=FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID }}
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: adnexa-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
