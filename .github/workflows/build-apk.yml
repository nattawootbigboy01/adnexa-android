name: Build ADNEXA APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project files
        run: flutter create . --platforms=android --project-name adnexa
      - name: Apply ADNEXA launcher icon and app name
        run: |
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_adnexa.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#080B10" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#DDE5EF" android:pathData="M15,82 L42,22 Q45,16 50,22 L77,82 L63,82 L46,43 L29,82 Z"/>
              <path android:fillColor="#9EADBF" android:pathData="M42,66 L51,48 L59,66 Z"/>
              <path android:fillColor="#258BFF" android:pathData="M55,69 L70,54 L78,61 L96,39 L96,57 L78,77 L70,69 L61,79 Z"/>
              <path android:fillColor="#258BFF" android:pathData="M81,26 L97,26 L97,42 L90,42 L90,33 L81,33 Z"/>
          </vector>
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = s.replace('android:label="adnexa"', 'android:label="ADNEXA ADS"')
          s = s.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@drawable/ic_adnexa"')
          p.write_text(s)
          PY
      - name: Install dependencies
        run: flutter pub get
      # Deprecation notices are informational; fail only on analyzer errors.
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Run widget and unit tests
        run: flutter test
      - name: Build release APK
        run: >-
          flutter build apk --release
          --dart-define=FIREBASE_API_KEY=${{ vars.FIREBASE_API_KEY }}
          --dart-define=FIREBASE_APP_ID=${{ vars.FIREBASE_APP_ID }}
          --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          --dart-define=FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID }}
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: adnexa-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate separate ADNEXA ADMIN Android project
        run: flutter create . --platforms=android --org com.adnexa --project-name admin
      - name: Apply ADNEXA ADMIN app label and launcher mark
        run: |
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_adnexa_admin.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#080B10" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#DDE5EF" android:pathData="M15,82 L42,22 Q45,16 50,22 L77,82 L63,82 L46,43 L29,82 Z"/>
              <path android:fillColor="#258BFF" android:pathData="M55,69 L70,54 L78,61 L96,39 L96,57 L78,77 L70,69 L61,79 Z"/>
            </vector>
          EOF
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = re.sub(r'android:label="[^"]+"', 'android:label="ADNEXA ADMIN"', s)
          s = s.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@drawable/ic_adnexa_admin"')
          p.write_text(s)
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze admin app
        run: flutter analyze --no-fatal-infos
      - name: Run admin app tests
        run: flutter test
      - name: Build ADNEXA ADMIN release APK
        run: >-
          flutter build apk --release
          --dart-define=FIREBASE_API_KEY=${{ vars.FIREBASE_API_KEY }}
          --dart-define=FIREBASE_APP_ID=${{ vars.ADMIN_FIREBASE_APP_ID }}
          --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          --dart-define=FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID }}
      - name: Upload ADNEXA ADMIN APK
        uses: actions/upload-artifact@v4
        with:
          name: adnexa-admin-apk
          path: admin_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
